[package]
name = "rochviewer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware access, decoders and platform tables for Roch Viewer"

[dependencies]
libloading = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Security", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Performance", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_System_Kernel", "Win32_System_EventLog", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole"] }
wmi = "0.18.4"

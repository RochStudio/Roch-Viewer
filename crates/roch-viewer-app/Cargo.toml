[package]
name = "roch-viewer-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "RochViewer"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"
rochviewer = { version = "1.1.0", path = "../rochviewer" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[build-dependencies]
winresource = "0.1.34"

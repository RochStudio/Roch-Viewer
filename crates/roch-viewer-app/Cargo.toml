[package]
name = "roch-viewer-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "RochViewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
png = "0.18.1"
rochviewer = { version = "1.1.0", path = "../rochviewer" }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[dev-dependencies]
rochviewer = { path = "../rochviewer", features = ["testing"] }

[build-dependencies]
winresource = "0.1.34"

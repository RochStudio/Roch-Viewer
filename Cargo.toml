[workspace]
resolver = "3"
members = ["crates/rochviewer", "crates/roch-viewer-app"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Roch Studio"]

[profile.release]
# Built for size: the window draws in well under a millisecond a frame and
# the readings are bound by the hardware, so speed-optimised code buys
# nothing a user can see, and costs a third of the executable.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The same decoders over a different way in: the hardware backend, the
    # identity sources and the window all have a Linux side of their own.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the tests
        # No hardware here either, and the tests are written so that it makes no
        # difference. They also must not reach for pkexec, which would hang on a
        # prompt nobody can answer.
        run: cargo test --workspace --locked

      - name: Check the release build
        run: cargo build --release --locked -p roch-viewer-app

  test:
    # Windows because the release is: it reads MCHBAR, the PCH SMBus and the
    # Super I/O through a Windows driver, and half the identity comes from WMI.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run the tests
        # No driver on a runner, and no memory controller worth reading. That
        # is deliberate rather than tolerated: the readers return nothing
        # without hardware, the library's own tests never touch the machine,
        # and the few that need a bench are #[ignore]d -- so what runs here is
        # the decoding, the table construction and the layout, the parts a
        # change can break without a bench to notice.
        run: cargo test --workspace --locked

      - name: Check the release build
        # The artifact is a convenience rather than a release -- it still
        # needs the driver alongside it, which this workflow deliberately does
        # not supply.
        run: cargo build --release --locked -p roch-viewer-app

      - uses: actions/upload-artifact@v4
        with:
          name: RochViewer-unsigned-no-driver
          path: target/release/RochViewer.exe
          if-no-files-found: error
